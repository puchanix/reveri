<!DOCTYPE html>
<html lang="en">
<head>

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site}}{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F3EEE9">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/pp_neue_montreal_medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/bradford_ll_regular_italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
{{extra_head}}
{{> analytics}}
</head>
<body class="{{body_class}}">
{{> header}}
<main>
{{content}}
</main>
{{> footer}}
{{> scripts}}
