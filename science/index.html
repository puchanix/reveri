<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Science &amp; Safety — Reveri</title>
<style>
:root{--ink:#0D0817;--text:#F4F1FA;--text2:#BEB3D2;--muted:#8C81A6;--line:rgba(255,255,255,.10);
--grad:linear-gradient(120deg,#7A3FF2 0%,#A845D8 48%,#E85D9E 100%);
--serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;line-height:1.6}
.logo{display:inline-block;margin-bottom:34px}
.logo img{height:30px;width:auto}
h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(30px,5vw,44px);margin-bottom:16px}
p{color:var(--text2);max-width:32em;margin-bottom:30px;font-size:17px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#C9F65A;margin-bottom:16px}
a.btn{display:inline-block;background:var(--grad);color:#fff;font-weight:700;font-size:16px;
padding:14px 30px;border-radius:999px;text-decoration:none}
a.btn:hover{transform:translateY(-2px)}
.back{margin-top:22px;font-size:14.5px;color:var(--muted)}
.back a{color:var(--text2)}
:focus-visible{outline:2px solid #C9F65A;outline-offset:3px}
</style>
</head>
<body>
  <a class="logo" href="/" aria-label="Reveri — home"><img src="/assets/logo.svg" alt="Reveri"></a>
  <p class="tag">Being rebuilt</p>
  <h1>Science &amp; Safety</h1>
  <p>The mechanism, the studies, outcome data with method, and how sessions handle distress land here in pass 2.</p>
  <a class="btn" href="https://app.reveri.com">Start your free 7-day trial</a>
  <p class="back"><a href="/">&larr; Back to the homepage</a></p>
</body>
</html>
